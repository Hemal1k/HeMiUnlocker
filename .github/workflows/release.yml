# A release published on GitHub gets its downloads here: they are built from the source of its tag and attached to it.
# Run by hand (Actions → Release → Run workflow) it only builds them, as an artifact to try out.
name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}

      - name: Rust
        run: rustup toolchain install stable --profile minimal

      - name: Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build the installer and the portable zip
        shell: pwsh
        run: ./release.ps1


      - name: Checksums
        shell: pwsh
        run: Get-ChildItem build/dist -File | Get-FileHash -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } | Set-Content build/dist/SHA256SUMS.txt

      - uses: actions/upload-artifact@v7
        with:
          name: HeMiUnlocker
          path: build/dist/*

      - name: Attach to the release
        if: github.event_name == 'release'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" build/dist/HeMiUnlocker-Setup.exe build/dist/HeMiUnlocker-Portable.zip build/dist/SHA256SUMS.txt --clobber --repo "${{ github.repository }}"
